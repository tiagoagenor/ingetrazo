# IngeTrazo's Rust workspace (docs/rust-rewrite-plan.md, section 2).
[workspace]
resolver = "2"
members = [
    "crates/ingetrazo-math",
    "crates/ingetrazo-geom",
    "crates/ingetrazo-formats",
    "crates/ingetrazo_py",
    "crates/ingetrazo-spike-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
ingetrazo-math = { path = "crates/ingetrazo-math" }
ingetrazo-geom = { path = "crates/ingetrazo-geom" }
ingetrazo-formats = { path = "crates/ingetrazo-formats" }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Kept on purpose in the parity kernels, which mirror Python and Qt line by
# line: `!(a < b)` keeps NaN behaving as in Python; `a <= x && x <= b` and
# index loops read like the Python they port; argument lists and tuple
# types follow the Python signatures; V3's sub/mul/div are Qt's operators
# without Rust's operator traits, so f32 order stays explicit.
[workspace.lints.clippy]
neg_cmp_op_on_partial_ord = "allow"
manual_range_contains = "allow"
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
