[package]
name = "ingetrazo-formats-mesh"
description = "IngeTrazo's mesh interchange formats: OBJ, STL, COLLADA, glTF/GLB and DXF import and export"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ingetrazo-math.workspace = true
ingetrazo-geom.workspace = true
ingetrazo-formats.workspace = true
ingetrazo-model = { path = "../ingetrazo-model" }
png = "0.18"

[dev-dependencies]
ingetrazo-golden = { path = "../ingetrazo-golden" }
ingetrazo-ops = { path = "../ingetrazo-ops" }

# A stand-in for dwg2dxf that the bridge tests run (tests/dwg.rs); never shipped.
[[bin]]
name = "fake-dwg2dxf"
path = "tests/support/fake_dwg2dxf.rs"
test = false
doc = false

[lints]
workspace = true
