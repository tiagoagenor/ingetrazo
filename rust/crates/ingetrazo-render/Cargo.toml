[package]
name = "ingetrazo-render"
description = "IngeTrazo's wgpu renderer (M4.1): faces, edges, display styles, instanced components"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ingetrazo-math.workspace = true
ingetrazo-geom.workspace = true
ingetrazo-formats.workspace = true
ingetrazo-model = { path = "../ingetrazo-model" }
ingetrazo-ops = { path = "../ingetrazo-ops" }
# The CPU picker: placements, owners and what the cursor may touch (M3.12).
ingetrazo-snap = { path = "../ingetrazo-snap" }
# Pinned to the version eframe/egui-wgpu 0.36.2 build against (Cargo.lock).
wgpu = "=30.0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "1.0.1"
png = "0.18"
zune-jpeg = "=0.5.15"
zune-core = "=0.5.3"

[lints]
workspace = true
