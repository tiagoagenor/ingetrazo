[package]
name = "ingetrazo-script"
description = "IngeTrazo's scripting (M8): a sandboxed Rhai engine over the Rust model; every change goes through ingetrazo-ops Commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ingetrazo-math.workspace = true
ingetrazo-formats.workspace = true
ingetrazo-model = { path = "../ingetrazo-model" }
ingetrazo-ops = { path = "../ingetrazo-ops" }
# no_module: `import` (the only way a script reaches a file) does not exist.
rhai = { version = "=1.26.1", features = ["no_module", "no_time"] }

[dev-dependencies]
ingetrazo-golden = { path = "../ingetrazo-golden" }

[lints]
workspace = true
