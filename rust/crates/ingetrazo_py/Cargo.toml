# The Python app's bridge to ingetrazo-geom while it still exists; deleted
# at M10 (docs/rust-rewrite-plan.md). The module keeps its old name,
# `ingetrazo_core`, which core/_native.py imports.
[package]
name = "ingetrazo_py"
description = "PyO3 shim over ingetrazo-geom (optional: Python falls back)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ingetrazo_core"
crate-type = ["cdylib"]

[dependencies]
ingetrazo-math.workspace = true
ingetrazo-geom.workspace = true
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
rayon.workspace = true
