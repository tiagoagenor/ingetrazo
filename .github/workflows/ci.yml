# SPDX-License-Identifier: GPL-3.0-or-later
# Run the fast test suite on every pull request and on every push to main
# (in the private development repository: pull requests and manual runs only).
#
# This is the gate the release workflows don't provide: build-windows.yml and
# release.yml only fire on a vX.Y.Z tag, so until now a PR showed "no checks
# reported" no matter what it broke. With this in place a contributor's PR
# gets a green check or a red cross without anyone reading the code first.
#
# Same recipe as release.yml's test step (ubuntu-22.04, Python 3.12, the
# "not slow" marker), minus everything packaging-related: no pyinstaller, no
# fuse/appimagetool, no xvfb — the tests that need Qt set (or we export)
# QT_QPA_PLATFORM=offscreen, so no display is required.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:        # manual runs from the Actions tab

# A force-push to a PR branch cancels the now-obsolete run instead of
# queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # tests only ever read the checkout

jobs:
  tests:
    name: pytest (not slow)
    # In the private development repository Actions minutes are counted, and a
    # push to main has already passed both suites locally before it went up:
    # there the gate runs on pull requests (and by hand) only. The public
    # repository keeps every trigger — its minutes are free.
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        # libegl/libgl + the xcb set: what PySide6 needs to even load its
        # platform plugins on a bare runner (same list as release.yml).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Python dependencies
        # Straight from requirements.txt — the single source of truth. That
        # pulls openskp from upstream's `main` branch, so CI always tests
        # against the same reader/writer local dev uses (the release workflows
        # pin a SHA instead, on purpose: installers must be reproducible; CI
        # should track the branch).
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -c "import PySide6, numpy, openskp, openskp.legacy; print('deps OK')"

      # The Rust engine (rust/crates/ingetrazo_py): built on every PR so the
      # parity tests (tests/test_*_native.py) run instead of skipping — the
      # safety net of the Rust migration (docs/rust-migration-plan.md).
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust engine
        run: |
          python -m pip install --quiet maturin
          maturin build --release -m rust/crates/ingetrazo_py/Cargo.toml -o "$RUNNER_TEMP/wheels"
          python -m pip install --quiet "$RUNNER_TEMP"/wheels/ingetrazo_py-*.whl
          INGETRAZO_RUST=1 python -c "import core._native as n; assert n.native is not None; print('engine:', n.engine())"

      - name: Tests
        # The slow marker is long fuzz sweeps; the PR gate is the fast set,
        # same as the release gate. Offscreen so no test can accidentally
        # depend on a display. In batches, one process each: the fast suite
        # no longer fits in a runner's memory as one process (see
        # scripts/pytest_batches.py).
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/pytest_batches.py -m "not slow" tests

      - name: Rust engine parity
        # The same tests with the engine forced on: each one runs a case on
        # both engines and compares them exactly.
        env:
          QT_QPA_PLATFORM: offscreen
          INGETRAZO_RUST: "1"
        run: python -m pytest -q tests/test_*_native.py tests/test_lazy_mesh_plan.py tests/test_vecmath.py

  # The Rust workspace on its own (docs/rust-rewrite-plan.md, M0.9): unit
  # tests and clippy on the three systems the 2.0 app ships for. The PyO3
  # shim is linted but not tested here: it only links inside Python, and the
  # parity tests in the job above exercise it.
  rust:
    name: rust (${{ matrix.os }})
    if: github.event_name != 'push' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # pyo3's build script needs an interpreter
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo clippy
        run: cargo clippy --workspace --exclude manifold-sys --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --exclude ingetrazo_py --exclude manifold-sys --locked
      # Solid booleans build Manifold from its C++ source (CMake + a C++17
      # compiler, a pinned and checksummed download): their own step, so the
      # rest of the workspace does not wait for it.
      - name: solids (Manifold)
        run: |
          cargo clippy -p manifold-sys -p ingetrazo-ops --features ingetrazo-ops/manifold --all-targets --locked -- -D warnings
          cargo test -p manifold-sys -p ingetrazo-ops --features ingetrazo-ops/manifold --locked
