name: Build macOS (Rust)

# The .app / .dmg of the Rust IngeTrazo (M9.2): a universal binary
# (aarch64 + x86_64), signed and notarised when the Apple secrets exist,
# ad-hoc signed otherwise. Side by side with release-macos.yml (the Python
# app, shipped until M10): this job only uploads an artifact, it never
# touches a Release.
#   - push of a vX.Y.Z tag
#   - manual run from the Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-14   # Apple Silicon; the x86_64 half is cross-compiled
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Optional signing: only when the repo defines the secrets. Forks and
      # unconfigured repos build ad-hoc signed; nothing here is required.
      - name: Developer ID certificate (optional)
        id: sign
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo 'No APPLE_CERT_P12_BASE64: the app is ad-hoc signed'
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)
          if [ -z "$IDENTITY" ]; then
            echo '::warning::no Developer ID Application identity in the certificate: ad-hoc signed'
            exit 0
          fi
          echo "APPLE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Version (tag or workspace)
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, stage, audit, sign, notarise and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          args=()
          if [ -n "$VERSION" ]; then args+=(-v "$VERSION"); fi
          ./packaging/macos/build.sh "${args[@]}"

      # The build already audited the staged .app and the .dmg; once more on
      # the artifact exactly as it will be uploaded.
      - name: Audit the .dmg (no Python)
        run: |
          ./packaging/audit_no_python.sh --dmg dist/rust/IngeTrazo-*-macos-universal-rust.dmg

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: ingetrazo-rust-macos-dmg
          path: dist/rust/IngeTrazo-*-macos-universal-rust.dmg
          if-no-files-found: error
          retention-days: 14
